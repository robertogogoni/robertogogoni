name: GitHub Metrics

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Main Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.svg
          user: robertogogoni
          template: classic
          base: header, activity, community, repositories
          base_indepth: yes
          config_timezone: America/Sao_Paulo
          repositories_forks: no
          repositories_skipped: hosts, adfilt, fuckfuckadblock, Adobe-URL-Block-List, Krakatau, developer-roadmap, awesome-oss-alternatives, awesome-shizuku, XClipper, apkscan, cookbook, Public-Guide, awesome-chatgpt-prompts, ubo-filters, filterlists, MoonWalker440, WSTxda, googlefonts-template-project, rafnixg, readme-to-markdown, chathub, datapub, github-star-graph-project, marreta, candle-craft-ux-vision
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_secrets: yes
          plugin_achievements_threshold: C
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 30
          plugin_languages_analysis_timeout_repositories: 10
          plugin_languages_categories: programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_ignored: html, css, jupyter notebook, batchfile, makefile, adblock filter list, hcl, r

      - name: Generate Isometric Calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-isocalendar.svg
          user: robertogogoni
          template: classic
          base: ""
          config_timezone: America/Sao_Paulo
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Generate Habits
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-habits.svg
          user: robertogogoni
          template: classic
          base: ""
          config_timezone: America/Sao_Paulo
          plugin_habits: yes
          plugin_habits_charts_type: classic
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_from: 200

      - name: Generate Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-languages.svg
          user: robertogogoni
          template: classic
          base: ""
          repositories_forks: no
          repositories_skipped: hosts, adfilt, fuckfuckadblock, Adobe-URL-Block-List, Krakatau, developer-roadmap, awesome-oss-alternatives, awesome-shizuku, XClipper, apkscan, cookbook, Public-Guide, awesome-chatgpt-prompts, ubo-filters, filterlists, MoonWalker440, WSTxda, googlefonts-template-project, rafnixg, readme-to-markdown, chathub, datapub, github-star-graph-project, marreta, candle-craft-ux-vision
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 30
          plugin_languages_analysis_timeout_repositories: 10
          plugin_languages_limit: 10
          plugin_languages_sections: most-used
          plugin_languages_details: percentage, lines
          plugin_languages_categories: programming
          plugin_languages_ignored: html, css, jupyter notebook, batchfile, makefile, adblock filter list, hcl, r

      - name: Generate Activity
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-activity.svg
          user: robertogogoni
          template: classic
          base: ""
          plugin_activity: yes
          plugin_activity_days: 14
          plugin_activity_filter: all
          plugin_activity_limit: 5
          plugin_activity_load: 300
          plugin_activity_visibility: public
